name: PAC48 Verify

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'AGENTS.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pac48-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and deterministic verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout PAC48
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SkoolKit
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'skoolkit==10.1'
          command -v bin2tap.py
          command -v tap2sna.py
          command -v trace.py
          command -v snapinfo.py

      - name: Build pinned sjasmplus 1.23.1
        run: |
          git clone --recursive --branch v1.23.1 --depth 1 https://github.com/z00m128/sjasmplus.git /tmp/sjasmplus
          make -C /tmp/sjasmplus -j2 USE_LUA=0
          sudo make -C /tmp/sjasmplus USE_LUA=0 install
          command -v sjasmplus
          sjasmplus --version

      - name: Run canonical PAC48 build
        run: |
          chmod +x tools/build.sh
          ./tools/build.sh

      - name: Verify expected outputs and build identity
        run: |
          set -euo pipefail
          test -s build/pac48.bin
          test -s build/pac48.tap
          VERSION="$(tr -d '[:space:]' < VERSION)"
          BUILD_ID="$(tr -d '[:space:]' < build/build_id.txt)"
          EXPECTED_BUILD_ID="$(printf '%s' "${GITHUB_SHA:0:7}" | tr '[:lower:]' '[:upper:]')"
          test "$BUILD_ID" = "$EXPECTED_BUILD_ID"
          test -s "build/pac48-${VERSION}.tap"
          test -s "build/pac48-${VERSION}-b${BUILD_ID}.tap"
          test -s src/generated/pac_shifted.asm
          test -s src/generated/build_info.asm
          test -s build/screen_label.txt
          grep -F "B${BUILD_ID}" build/screen_label.txt
          test -s build/runtime_harness.trace.log
          test -s build/perf_results.txt
          test -s build/tap_load.z80
          test -s build/tap_load.log
          wc -c build/pac48.bin build/pac48.tap "build/pac48-${VERSION}.tap" "build/pac48-${VERSION}-b${BUILD_ID}.tap"
          cat build/screen_label.txt
          cat build/perf_results.txt
          tail -n 30 build/tap_load.log

      - name: Prepare verified release package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          BUILD_ID="$(tr -d '[:space:]' < build/build_id.txt)"
          SCREEN_LABEL="$(tr -d '\r\n' < build/screen_label.txt)"
          mkdir -p release
          cp build/pac48.tap release/pac48-latest.tap
          cp "build/pac48-${VERSION}.tap" "release/pac48-${VERSION}.tap"
          cp "build/pac48-${VERSION}-b${BUILD_ID}.tap" "release/pac48-${VERSION}-b${BUILD_ID}.tap"
          (
            cd release
            sha256sum \
              pac48-latest.tap \
              "pac48-${VERSION}.tap" \
              "pac48-${VERSION}-b${BUILD_ID}.tap" \
              > SHA256SUMS.txt
          )
          {
            echo "PAC48 latest verified build"
            echo
            echo "Version: ${VERSION}"
            echo "Build ID: ${BUILD_ID}"
            echo "On-screen stamp: ${SCREEN_LABEL}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Target: ZX Spectrum 48K"
            echo
            echo "Verification completed before publication:"
            echo "- deterministic structural and architecture checks"
            echo "- generated version/build identity checks"
            echo "- renderer reference-model tests"
            echo "- sjasmplus assembly with zero errors/warnings"
            echo "- headless 48K Z80 runtime harness"
            echo "- contention-aware Render_Commit timing measurements"
            echo "- TAP generation"
            echo "- simulated fresh-48K tape load reaching entry point 32768 (0x8000)"
            echo
            echo "Render_Commit timing evidence:"
            sed 's/^/- /' build/perf_results.txt
            echo
            echo "For screenshots/manual tests prefer pac48-${VERSION}-b${BUILD_ID}.tap."
            echo "pac48-latest.tap remains the stable convenience filename."
          } > release/BUILD-INFO.txt

      - name: Upload verified build and evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pac48-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/pac48.bin
            build/pac48.tap
            build/pac48-*.tap
            build/build_id.txt
            build/screen_label.txt
            src/generated/pac_shifted.asm
            src/generated/build_info.asm
            build/runtime_harness.trace.log
            build/runtime_harness.z80
            build/perf_results.txt
            build/perf_*_measure.log
            build/tap_load.z80
            build/tap_load.log

      - name: Upload release package for publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pac48-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: release/

  publish-latest:
    name: Publish latest verified TAP
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout version metadata
        uses: actions/checkout@v4

      - name: Download verified release package
        uses: actions/download-artifact@v4
        with:
          name: pac48-release-${{ github.sha }}
          path: release

      - name: Verify release package integrity
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          BUILD_ID="$(printf '%s' "${GITHUB_SHA:0:7}" | tr '[:lower:]' '[:upper:]')"
          test -s release/pac48-latest.tap
          test -s "release/pac48-${VERSION}.tap"
          test -s "release/pac48-${VERSION}-b${BUILD_ID}.tap"
          test -s release/SHA256SUMS.txt
          test -s release/BUILD-INFO.txt
          grep -F "Build ID: ${BUILD_ID}" release/BUILD-INFO.txt
          (
            cd release
            sha256sum --check SHA256SUMS.txt
          )

      - name: Publish immutable per-commit release and mark Latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          BUILD_ID="$(printf '%s' "${GITHUB_SHA:0:7}" | tr '[:lower:]' '[:upper:]')"
          SHORT_SHA="${GITHUB_SHA:0:12}"
          TAG="build-${SHORT_SHA}"

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              release/pac48-latest.tap \
              "release/pac48-${VERSION}.tap" \
              "release/pac48-${VERSION}-b${BUILD_ID}.tap" \
              release/SHA256SUMS.txt \
              release/BUILD-INFO.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "PAC48 latest verified build (${VERSION}, ${BUILD_ID})" \
              --notes-file release/BUILD-INFO.txt \
              --latest
          else
            echo "Release $TAG already exists; leaving verified release unchanged."
          fi

          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,url,assets

          LATEST_TAG="$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 20 \
            --json tagName,isLatest \
            --jq '.[] | select(.isLatest) | .tagName' \
            | head -n1)"
          test "$LATEST_TAG" = "$TAG"
          echo "Verified latest release tag: $LATEST_TAG"

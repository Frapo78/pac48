name: PAC48 independent emulator smoke
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pac48-emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  zen-zx:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Install build dependencies
        run: |
          python -m pip install 'skoolkit==10.1'
          git clone --recursive --branch v1.23.1 --depth 1 https://github.com/z00m128/sjasmplus.git /tmp/sjasmplus
          make -C /tmp/sjasmplus -j2 USE_LUA=0
          sudo make -C /tmp/sjasmplus USE_LUA=0 install
      - name: Build PAC48 with existing verification suite
        run: bash tools/build.sh
      - name: Build independent ZenZX headless emulator
        run: |
          git clone --depth 1 https://github.com/ha1tch/zenzx.git /tmp/zenzx
          (cd /tmp/zenzx && bash build_headless.sh)
          test -x /tmp/zenzx/zenzx-headless
      - name: Verify emulator screen capture independently
        run: |
          mkdir -p build/zenzx-probe
          python tools/make_zenzx_probe.py build/zenzx-probe/probe.scr
          /tmp/zenzx/zenzx-headless -model=48k -scr=build/zenzx-probe/probe.scr -frames=1 -shot-dir=build/zenzx-probe -shot-prefix=probe
          python tools/check_zenzx_capture.py build/zenzx-probe/*.png
      - name: Verify raw Z80 execution and screen writes
        run: |
          mkdir -p build/zenzx-boot-probe
          python tools/make_zenzx_boot_probe.py build/zenzx-boot-probe/boot.bin
          /tmp/zenzx/zenzx-headless -model=48k -bin=build/zenzx-boot-probe/boot.bin -binaddr=0x8000 -frames=3 -shot-dir=build/zenzx-boot-probe -shot-prefix=boot
          python tools/check_zenzx_capture.py build/zenzx-boot-probe/*.png
      - name: Probe ROM CLS on direct binary entry
        run: |
          mkdir -p build/zenzx-rom-probe
          python tools/make_zenzx_rom_probe.py build/zenzx-rom-probe/rom.bin
          /tmp/zenzx/zenzx-headless -model=48k -bin=build/zenzx-rom-probe/rom.bin -binaddr=0x8000 -frames=5 -shot-dir=build/zenzx-rom-probe -shot-prefix=rom
          python tools/check_zenzx_capture.py build/zenzx-rom-probe/*.png
      - name: Diagnose early PAC48 screen transitions
        run: |
          mkdir -p build/zenzx-early
          /tmp/zenzx/zenzx-headless -model=48k -bin=build/pac48.bin -binaddr=0x8000 -frames=12 -shot-interval=1 -shot-dir=build/zenzx-early -shot-prefix=early
          for capture in build/zenzx-early/*.png; do
            python tools/check_zenzx_capture.py "$capture" || true
          done
      - name: Run 48K visual smoke test
        env:
          ZENZX_BIN: /tmp/zenzx/zenzx-headless
        run: bash tools/run_zenzx_smoke.sh
      - name: Validate screenshot checker
        run: python -m unittest discover -s tests -p 'test_zenzx_capture.py' -v
      - name: Validate actual emulated screen (fail on black)
        run: python tools/check_zenzx_capture.py build/zenzx/*.png
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pac48-zenzx-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            build/zenzx/
            build/zenzx-probe/
            build/zenzx-boot-probe/
            build/zenzx-early/
            build/zenzx-rom-probe/
